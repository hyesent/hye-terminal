name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 platforms;android-34 build-tools;36.0.0 build-tools;34.0.0 ndk;27.0.12077973 cmake;3.22.1'

      # Download the upstream LibTermux source.
      - name: Checkout LibTermux SDK source
        uses: actions/checkout@v4
        with:
          repository: libtermux/libtermux-android
          ref: main
          path: .ci/libtermux-sdk

      # Build and publish the SDK to the local Maven repository.
      # Skip Maven publication signing because CI has no signing keys.
      - name: Build and publish LibTermux SDK locally
        working-directory: .ci/libtermux-sdk
        run: |
          chmod +x gradlew
          ./gradlew \
            :core:publishToMavenLocal \
            :bootstrap-arm:publishToMavenLocal \
            :bootstrap-arm64:publishToMavenLocal \
            :bootstrap-x86:publishToMavenLocal \
            :bootstrap-x86_64:publishToMavenLocal \
            -x signMavenPublication \
            --no-daemon

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy web assets to Android
        run: npx cap copy android

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Produce one APK containing all configured Android ABIs.
      - name: Name the single universal APK
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/debug"
          test -f "$APK_DIR/app-debug.apk"
          cp "$APK_DIR/app-debug.apk" "$APK_DIR/HyeTerminal.apk"
          ls -lh "$APK_DIR/HyeTerminal.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyeTerminal
          path: android/app/build/outputs/apk/debug/HyeTerminal.apk
          if-no-files-found: error

      - name: Upload APK to Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          draft: false
          files: android/app/build/outputs/apk/debug/HyeTerminal.apk
          allowUpdates: true
          replacesArtifacts: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
